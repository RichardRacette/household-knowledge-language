name: Validate household records

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validation tests
        run: python -m unittest -v test_validate_record.py

      - name: Validate fictional examples
        run: |
          python validate_record.py ceramic_bird.json
          python validate_record.py composite_memory_shelf.json
